<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b14">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
<title>REX AI</title>
</head>
<body>
<main class="app-shell">
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">R</span><span>REX<span class="accent">.AI</span><small>PERSONAL INTELLIGENCE</small></span></a><span class="status"><i></i> READY</span></header>
<section class="welcome" id="welcome"><div class="orb"><span>R</span></div><p class="eyebrow">YOUR AI. YOUR RULES.</p><h1>What can I help<br><span>you with?</span></h1><p class="sub">Ask anything. Think clearly. Get things done.</p><div class="suggestions"><button class="suggestion" data-prompt="Explain a difficult topic in simple Hindi.">✦ Explain a topic</button><button class="suggestion" data-prompt="Help me make a practical study plan for today.">▤ Plan my day</button><button class="suggestion" data-prompt="Give me ideas for a useful personal project.">⌘ Explore ideas</button></div></section>
<section id="chat" class="chat" aria-live="polite"></section>
<form id="composer" class="composer"><textarea id="message" rows="1" maxlength="6000" placeholder="Message REX..."></textarea><div class="composer-bottom"><span class="hint">REX can make mistakes. Verify important information.</span><div class="tools"><button type="button" id="voiceBtn" class="icon-btn" aria-label="Voice input">🎙</button><button type="submit" id="sendBtn" class="send-btn" aria-label="Send">↑</button></div></div></form>
<footer>REX AI • BUILT TO GROW</footer></main><script src="/app.js" defer></script>
</body></html>
